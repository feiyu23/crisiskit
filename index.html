        <h1 style="color: #dc2626; font-size: 28px; margin-bottom: 8px;">Sparks Beacon · 星火应急信标</h1>
        <p style="font-size: 16px; color: #4b5563; margin-bottom: 24px;">
          纯公益全球全天候离线防灾求生站。专为<strong>地震、火山喷发、洪涝、风雪暴寒、泥石流、断网断电孤岛与公共卫生紧急状态</strong>打造。支持完全离线与零流量运行。
        </p>

        <h2 style="font-size: 20px; color: #111827; border-bottom: 2px solid #e5e7eb; padding-bottom: 8px;">核心防灾与自救互助功能：</h2>
        <ul style="padding-left: 20px; margin-top: 12px;">
          <li style="margin-bottom: 12px;">
            <strong>🎒 72h / 7天 极境家庭备灾物资计算器</strong>：依据北欧（瑞典 MSB / 挪威 DSB）与德国民防局（BBK）权威标准，科学测算全家饮用水（3.5L/人/天）、免烹饪高能口粮、14天慢性病常备药、便携卡式炉与应急卫生储备。
          </li>
          <li style="margin-bottom: 12px;">
            <strong>🤝 社区与避难所余缺互助调剂板</strong>：断网孤岛与临时安置点物物调剂。“我有余/可提供”（发电机充电、多余净水片、多余消炎药）与“我急需”（降压药、婴儿奶粉、保温毯），就地余缺互济。
          </li>
          <li style="margin-bottom: 12px;">
            <strong>🚨 声光救援信标 (SOS)</strong>：夜间与浓雾穿透性屏幕摩尔斯 SOS 强光频闪，搭配国际搜救 3.1kHz 穿透性音频救生哨，引导直升机与搜救队准确定位。
          </li>
          <li style="margin-bottom: 12px;">
            <strong>📡 零流量短信 / 卫星短报文一键呼救</strong>：自动提取设备高精度 GPS 经纬度、海拔与伤情，离线生成高密度短报文，直通亲友与应急搜救队。
          </li>
          <li style="margin-bottom: 12px;">
            <strong>📖 极境多灾种自救避险手册</strong>：涵盖地震室内外避险、泥石流垂直两侧高地逃生、火山灰呼吸道与眼部防护、高寒湿冷隔绝地面防失温生死法则、野外泥水三步净化沸腾与避难所防交叉感染。
          </li>
          <li style="margin-bottom: 12px;">
            <strong>📋 离线报平安与避难所寻亲名册</strong>：零网络环境下登记避难者姓名、同行人数与安置位置，支持受灾群众与搜救队伍离线快速比对寻亲。
          </li>
        </ul>

        <h2 style="font-size: 20px; color: #111827; border-bottom: 2px solid #e5e7eb; padding-bottom: 8px; margin-top: 24px;">深度防灾与备灾文库文章：</h2>

            <p style="font-size: 13px; color: #6b7280; margin: 4px 0;">依据瑞典民防局(MSB)与德国民防局(BBK)官方标准，拆解饮用水（3.5L/人/天）、免烹饪高能口粮与慢病药储备。</p>
          </li>
          <li style="margin-bottom: 8px;">

          </li>
